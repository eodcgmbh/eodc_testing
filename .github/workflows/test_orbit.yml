name: Test Orbit

on:
  push:
    paths:
        - 'scripts/test_orbit.py'
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  test-orbit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: prod
            url: https://orbit.discovery.eodc.eu
          - env: dev
            url: https://orbit.development.eodc.eu
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests opentelemetry-sdk opentelemetry-exporter-otlp-proto-http

      - name: Set OTel env
        run: |
          echo "OTEL_ENDPOINT=https://otel.observability.eodc.eu/v1/metrics" >> $GITHUB_ENV
          echo "OTEL_API_KEY=${{ secrets.OTEL_API_KEY }}" >> $GITHUB_ENV
          echo "E2E_ENV=${{ matrix.env }}" >> $GITHUB_ENV
          echo "ORBIT_URL=${{ matrix.url }}" >> $GITHUB_ENV

      - name: Run Orbit Test
        continue-on-error: true
        run: python scripts/test_orbit.py
