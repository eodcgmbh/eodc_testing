name: Test C3S CDS

on:
  push:
    paths:
        - 'scripts/test_cds_c3s.py'
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  test-cds-c3s:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests opentelemetry-sdk opentelemetry-exporter-otlp-proto-http

      - name: Set OTel env
        run: |
          echo "OTEL_ENDPOINT=https://otel.observability.eodc.eu/v1/metrics" >> $GITHUB_ENV
          echo "OTEL_API_KEY=${{ secrets.OTEL_API_KEY }}" >> $GITHUB_ENV
          echo "E2E_ENV=prod" >> $GITHUB_ENV

      - name: Run C3S CDS Test
        continue-on-error: true
        env:
          CDS_USERNAME: ${{ secrets.CDS_USERNAME }}
          CDS_PASSWORD: ${{ secrets.CDS_PASSWORD }}
        run: python scripts/test_cds_c3s.py
