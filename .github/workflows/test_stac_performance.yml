name: Test STAC Performance

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      stac_env:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - dev
      collection:
        description: "Collection ID to probe (leave blank for auto-detect)"
        required: false
        default: ""

jobs:
  test-stac-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests locust shapely opentelemetry-sdk opentelemetry-exporter-otlp-proto-http

      - name: Set OTel env
        run: |
          STAC_ENV="${{ inputs.stac_env || 'prod' }}"
          if [ "$STAC_ENV" = "prod" ]; then
            echo "STAC_URL=https://stac.eodc.eu/api/v1" >> $GITHUB_ENV
          else
            echo "STAC_URL=https://dev.stac.eodc.eu/api/v1" >> $GITHUB_ENV
          fi
          echo "E2E_ENV=$STAC_ENV" >> $GITHUB_ENV
          echo "OTEL_ENDPOINT=https://otel.observability.eodc.eu/v1/metrics" >> $GITHUB_ENV
          echo "OTEL_API_KEY=${{ secrets.OTEL_API_KEY }}" >> $GITHUB_ENV
          echo "STAC_PERF_COLLECTION=${{ inputs.collection }}" >> $GITHUB_ENV

      - name: Run STAC performance test
        run: python scripts/test_stac_performance.py
