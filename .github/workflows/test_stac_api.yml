name: Test STAC API

on:
  push:
    paths:
        - 'scripts/test_stac_api.py'   
  schedule:
    - cron: "*/30 * * * *"  
  workflow_dispatch:

jobs:
  test-stac-api:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: prod
            url: https://stac.eodc.eu/api/v1
          - env: dev
            url: https://dev.stac.eodc.eu/api/v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set OTel env
        run: |
          echo "OTEL_ENDPOINT=https://otel.observability.eodc.eu/v1/metrics" >> $GITHUB_ENV
          echo "OTEL_API_KEY=${{ secrets.OTEL_API_KEY }}" >> $GITHUB_ENV
          echo "E2E_ENV=${{ matrix.env }}" >> $GITHUB_ENV
          echo "STAC_URL=${{ matrix.url }}" >> $GITHUB_ENV

      - name: Run STAC API Test
        continue-on-error: true
        run: python scripts/test_stac_api.py
